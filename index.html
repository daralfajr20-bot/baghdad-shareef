<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sacred Directions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d2e">
<link rel="icon" type="image/png" sizes="192x192" href="icon-baghdad-192.png">
<link rel="apple-touch-icon" href="icon-baghdad-192.png">
<style>
  :root{
    --green-deep:#0b3d2e; --green-mid:#12563f; --green-glow:#1c7a55;
    --gold:#d4af37; --gold-soft:#e9cf7a; --cream:#f3ead7; --ink:#0a2119;
    font-family:"Amiri","Georgia",serif;
  }
  :root:not([data-theme="light"]){ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }
  :root[data-theme="dark"]{ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); } }
  :root[data-theme="light"]{ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }

  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));
    background: radial-gradient(circle at 50% -10%, var(--green-mid) 0%, transparent 55%), linear-gradient(180deg, var(--bg) 0%, #061914 100%);
    overflow-x:hidden;
  }
  .lattice{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.10;
    background-image: repeating-linear-gradient(45deg, var(--gold) 0 1px, transparent 1px 26px), repeating-linear-gradient(-45deg, var(--gold) 0 1px, transparent 1px 26px); }

  .wrap{ position:relative; z-index:1; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }

  header{ text-align:center; margin-bottom:4px; }
  h1{ font-size:1.25rem; margin:0; color:var(--gold-soft); letter-spacing:.02em; font-weight:700; }
  .sub{ font-size:.78rem; color:rgba(243,234,215,.65); margin-top:4px; font-family:Georgia,serif; font-style:italic; }

  .dest-row{ display:flex; gap:10px; width:100%; margin-top:16px; }
  .dest-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--panel); border:2px solid transparent; border-radius:16px; padding:9px 6px 10px;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .dest-btn img{ width:44px; height:44px; border-radius:11px; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .dest-btn span{ font-size:.68rem; color:var(--cream); font-weight:700; text-align:center; line-height:1.2; }
  .dest-btn.active{ border-color:var(--gold); transform:translateY(-2px); background:rgba(212,175,55,.12); }

  .status{ width:100%; background:rgba(212,175,55,.08); border:1px solid rgba(212,175,55,.35);
    border-radius:14px; padding:11px 15px; margin:16px 0 8px; font-size:.83rem; color:var(--cream); line-height:1.4; text-align:center; }
  .status b{ color:var(--gold-soft); }

  .compass-stage{ position:relative; width:min(74vw,280px); height:min(74vw,280px); margin:14px 0 12px; display:flex; align-items:center; justify-content:center; }
  .ring{ position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, var(--green-glow) 0%, var(--green-mid) 55%, var(--green-deep) 100%);
    box-shadow: 0 0 0 2px rgba(212,175,55,.55), 0 0 0 10px rgba(212,175,55,.08), inset 0 4px 24px rgba(0,0,0,.45); }
  .ticks{ position:absolute; inset:0; }
  .ticks div{ position:absolute; left:50%; top:6px; width:2px; height:11px; background:rgba(233,207,122,.55); transform-origin:1px 134px; }
  .ticks div.major{ height:15px; width:3px; background:var(--gold-soft); }
  .cardinal{ position:absolute; inset:0; font-size:.75rem; font-weight:700; color:var(--gold-soft); }
  .cardinal span{ position:absolute; transform:translate(-50%,-50%); }
  .n{ top:9%; left:50%; } .e{ top:50%; left:91%; } .s{ top:91%; left:50%; } .w{ top:50%; left:9%; }

  .needle-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition:transform .25s ease-out; }
  .needle-shaft{ width:6px; height:40%; background:linear-gradient(180deg, var(--gold-soft), var(--gold)); border-radius:4px; position:relative; }
  .needle-icon{
    position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    width:52px; height:52px; border-radius:14px; border:2px solid var(--gold); object-fit:cover;
    box-shadow:0 0 10px rgba(212,175,55,.6);
  }
  .needle-tail{ position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:7px solid transparent; border-right:7px solid transparent; border-top:14px solid var(--gold-soft); opacity:.55; }

  .hub{ position:absolute; width:12%; height:12%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #8a6b1e 100%); box-shadow:0 0 8px rgba(212,175,55,.7); }

  .readout{ display:flex; gap:12px; width:100%; margin-top:2px; }
  .card{ flex:1; background:var(--panel); border:1px solid rgba(212,175,55,.3); border-radius:14px; padding:11px; text-align:center; }
  .card .label{ font-size:.65rem; text-transform:uppercase; letter-spacing:.08em; color:rgba(233,207,122,.75); font-family:Georgia,serif;}
  .card .value{ font-size:1.25rem; color:var(--gold-soft); font-weight:700; margin-top:2px; }

  .btnrow{ display:flex; flex-direction:column; gap:9px; width:100%; margin-top:16px; }
  button{ font-family:inherit; font-size:.92rem; font-weight:700; color:var(--ink);
    background:linear-gradient(180deg, var(--gold-soft), var(--gold)); border:none; border-radius:12px; padding:12px 16px; cursor:pointer;
    box-shadow:0 3px 0 #8a6b1e, 0 6px 14px rgba(0,0,0,.35); }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #8a6b1e; }
  button.secondary{ background:transparent; color:var(--gold-soft); border:1px solid rgba(212,175,55,.5); box-shadow:none; }
  button:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:2px; }

  .note{ font-size:.7rem; color:rgba(243,234,215,.5); text-align:center; margin-top:14px; line-height:1.5; }
  @media (prefers-reduced-motion:reduce){ .needle-wrap{ transition:none; } }
</style>
</head>
<body>
<div class="lattice"></div>
<div class="wrap">
  <header>
    <h1>Sacred Directions</h1>
    <div class="sub">Baghdad Shareef &middot; Kaabah &middot; Madina Shareef</div>
  </header>

  <div class="dest-row" id="destRow"></div>

  <div class="status" id="status">Tap <b>Start</b> and allow location + compass access to find the direction.</div>

  <div class="compass-stage">
    <div class="ring"></div>
    <div class="ticks" id="ticks"></div>
    <div class="cardinal"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span></div>
    <div class="needle-wrap" id="needleWrap">
      <div class="needle-shaft">
        <img class="needle-icon" id="needleIcon" src="" alt="destination icon">
        <div class="needle-tail"></div>
      </div>
    </div>
    <div class="hub"></div>
  </div>

  <div class="readout">
    <div class="card"><div class="label">Bearing</div><div class="value" id="bearingVal">&#8212;</div></div>
    <div class="card"><div class="label">Distance</div><div class="value" id="distVal">&#8212;</div></div>
  </div>

  <div class="btnrow">
    <button id="startBtn">Start &#8212; Find Direction</button>
    <button id="calBtn" class="secondary" style="display:none;">Recalibrate compass (move phone in a figure-8)</button>
  </div>

  <div class="note">Works best outdoors on a phone browser with GPS &amp; compass sensors. Keep your phone flat and level.</div>
</div>

<script>
  const DESTINATIONS = [
    { id:'baghdad', label:'Baghdad Shareef', icon:'icon-baghdad-512.png', lat:33.33639, lon:44.40806 },
    { id:'kaaba',   label:'Al-Kaabah, Makkah', icon:'icon-kaaba-512.png', lat:21.4225,  lon:39.8262 },
    { id:'madina',  label:'Madina Shareef', icon:'icon-madina-512.png', lat:24.4672,  lon:39.6112 }
  ];
  let activeDest = DESTINATIONS[0];

  const statusEl = document.getElementById('status');
  const bearingVal = document.getElementById('bearingVal');
  const distVal = document.getElementById('distVal');
  const needleWrap = document.getElementById('needleWrap');
  const needleIcon = document.getElementById('needleIcon');
  const startBtn = document.getElementById('startBtn');
  const calBtn = document.getElementById('calBtn');
  const ticks = document.getElementById('ticks');
  const destRow = document.getElementById('destRow');

  for(let i=0;i<72;i++){
    const d = document.createElement('div');
    const deg = i*5;
    d.style.transform = `rotate(${deg}deg)`;
    if(deg % 30 === 0) d.classList.add('major');
    ticks.appendChild(d);
  }

  function renderDestRow(){
    destRow.innerHTML = '';
    DESTINATIONS.forEach(dest => {
      const btn = document.createElement('div');
      btn.className = 'dest-btn' + (dest.id === activeDest.id ? ' active' : '');
      btn.innerHTML = `<img src="${dest.icon}" alt="${dest.label}"><span>${dest.label}</span>`;
      btn.addEventListener('click', () => {
        activeDest = dest;
        renderDestRow();
        needleIcon.src = dest.icon;
        if (lastCoords) updateForCoords(lastCoords.lat, lastCoords.lon);
        statusEl.innerHTML = `Now finding the direction of <b>${dest.label}</b>...`;
      });
      destRow.appendChild(btn);
    });
  }
  renderDestRow();
  needleIcon.src = activeDest.icon;

  let bearingToDest = null;
  let compassHeading = 0;
  let orientationActive = false;
  let lastCoords = null;

  function toRad(d){ return d*Math.PI/180; }
  function toDeg(r){ return r*180/Math.PI; }

  function computeBearingDistance(lat1, lon1, lat2, lon2){
    const phi1 = toRad(lat1), phi2 = toRad(lat2);
    const dLambda = toRad(lon2-lon1);
    const y = Math.sin(dLambda)*Math.cos(phi2);
    const x = Math.cos(phi1)*Math.sin(phi2) - Math.sin(phi1)*Math.cos(phi2)*Math.cos(dLambda);
    let theta = toDeg(Math.atan2(y,x));
    theta = (theta + 360) % 360;
    const R = 6371;
    const dPhi = toRad(lat2-lat1);
    const a = Math.sin(dPhi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dLambda/2)**2;
    const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return { bearing: theta, distance: R*c };
  }

  function updateNeedle(){
    if(bearingToDest === null) return;
    const rotation = orientationActive ? (bearingToDest - compassHeading) : bearingToDest;
    needleWrap.style.transform = `rotate(${rotation}deg)`;
    bearingVal.textContent = Math.round(bearingToDest) + '\u00B0';
  }

  function updateForCoords(lat, lon){
    const { bearing, distance } = computeBearingDistance(lat, lon, activeDest.lat, activeDest.lon);
    bearingToDest = bearing;
    distVal.textContent = distance < 10 ? distance.toFixed(2)+' km' : Math.round(distance).toLocaleString()+' km';
    updateNeedle();
  }

  function handleOrientation(event){
    let heading;
    if (typeof event.webkitCompassHeading === 'number') heading = event.webkitCompassHeading;
    else if (event.alpha !== null) heading = 360 - event.alpha;
    else return;
    compassHeading = heading;
    orientationActive = true;
    updateNeedle();
  }

  async function enableCompass(){
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') { statusEl.textContent = 'Compass permission denied. Showing bearing from true north instead.'; return; }
      } catch(e) { statusEl.textContent = 'Could not access the compass sensor on this device.'; return; }
    }
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
    calBtn.style.display = 'block';
  }

  function locate(){
    if (!navigator.geolocation) { statusEl.textContent = 'This browser has no location support.'; return; }
    statusEl.textContent = 'Locating you...';
    navigator.geolocation.watchPosition(pos => {
      const { latitude, longitude } = pos.coords;
      lastCoords = { lat: latitude, lon: longitude };
      updateForCoords(latitude, longitude);
      statusEl.innerHTML = `Turn until the needle's icon points <b>straight up</b> &#8212; that is the direction of <b>${activeDest.label}</b>.`;
    }, err => {
      statusEl.textContent = 'Location error: ' + err.message + '. Please allow location access and try again.';
    }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  }

  startBtn.addEventListener('click', () => {
    enableCompass();
    locate();
    startBtn.textContent = 'Refreshing...';
    setTimeout(()=> startBtn.textContent = 'Refresh', 1200);
  });

  calBtn.addEventListener('click', () => {
    statusEl.textContent = 'Move your phone in a slow figure-8 a few times, away from metal objects.';
  });
</script>
</body>
</html>
