<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baghdad Shareef Direction</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d2e">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{
    --green-deep:#0b3d2e;
    --green-mid:#12563f;
    --green-glow:#1c7a55;
    --gold:#d4af37;
    --gold-soft:#e9cf7a;
    --cream:#f3ead7;
    --ink:#0a2119;
    font-family:"Amiri","Georgia",serif;
  }
  :root:not([data-theme="light"]){ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }
  :root[data-theme="dark"]{ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }
  }
  :root[data-theme="light"]{ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(circle at 50% -10%, var(--green-mid) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, #061914 100%);
    overflow-x:hidden;
  }

  .lattice{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.10;
    background-image:
      repeating-linear-gradient(45deg, var(--gold) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(-45deg, var(--gold) 0 1px, transparent 1px 26px);
  }

  .wrap{ position:relative; z-index:1; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }

  header{ text-align:center; margin-bottom:6px; }
  .dome-icon{ width:64px; height:64px; margin-bottom:6px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
  h1{
    font-size:1.35rem; margin:0; color:var(--gold-soft); letter-spacing:.02em; font-weight:700;
  }
  .sub{
    font-size:.82rem; color:rgba(243,234,215,.65); margin-top:4px; font-family:Georgia,serif; font-style:italic;
  }

  .status{
    width:100%; background:rgba(212,175,55,.08); border:1px solid rgba(212,175,55,.35);
    border-radius:14px; padding:12px 16px; margin:18px 0 10px; font-size:.85rem;
    color:var(--cream); line-height:1.4; text-align:center;
  }
  .status b{ color:var(--gold-soft); }

  .compass-stage{
    position:relative; width:min(78vw,300px); height:min(78vw,300px); margin:18px 0 14px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, var(--green-glow) 0%, var(--green-mid) 55%, var(--green-deep) 100%);
    box-shadow:
      0 0 0 2px rgba(212,175,55,.55),
      0 0 0 10px rgba(212,175,55,.08),
      inset 0 4px 24px rgba(0,0,0,.45);
  }
  .ticks{ position:absolute; inset:0; }
  .ticks div{
    position:absolute; left:50%; top:6px; width:2px; height:12px; background:rgba(233,207,122,.55);
    transform-origin:1px 144px;
  }
  .ticks div.major{ height:16px; width:3px; background:var(--gold-soft); }
  .cardinal{
    position:absolute; inset:0; font-size:.8rem; font-weight:700; color:var(--gold-soft);
  }
  .cardinal span{ position:absolute; transform:translate(-50%,-50%); }
  .n{ top:9%; left:50%; } .e{ top:50%; left:91%; } .s{ top:91%; left:50%; } .w{ top:50%; left:9%; }

  .needle-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    transition:transform .25s ease-out;
  }
  .needle{ width:34%; height:34%; }

  .hub{
    position:absolute; width:14%; height:14%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #8a6b1e 100%);
    box-shadow:0 0 8px rgba(212,175,55,.7);
  }

  .readout{
    display:flex; gap:14px; width:100%; margin-top:4px;
  }
  .card{
    flex:1; background:var(--panel); border:1px solid rgba(212,175,55,.3); border-radius:14px;
    padding:12px; text-align:center;
  }
  .card .label{ font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:rgba(233,207,122,.75); font-family:Georgia,serif;}
  .card .value{ font-size:1.35rem; color:var(--gold-soft); font-weight:700; margin-top:2px; }

  .btnrow{ display:flex; flex-direction:column; gap:10px; width:100%; margin-top:20px; }
  button{
    font-family:inherit; font-size:.95rem; font-weight:700; color:var(--ink);
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    border:none; border-radius:12px; padding:13px 18px; cursor:pointer;
    box-shadow:0 3px 0 #8a6b1e, 0 6px 14px rgba(0,0,0,.35);
  }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #8a6b1e; }
  button.secondary{
    background:transparent; color:var(--gold-soft); border:1px solid rgba(212,175,55,.5);
    box-shadow:none;
  }
  button:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:2px; }

  .note{ font-size:.72rem; color:rgba(243,234,215,.5); text-align:center; margin-top:16px; line-height:1.5; }

  @media (prefers-reduced-motion:reduce){
    .needle-wrap{ transition:none; }
  }
</style>
</head>
<body>
<div class="lattice"></div>
<div class="wrap">
  <header>
    <svg class="dome-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Shrine dome icon">
      <ellipse cx="50" cy="86" rx="34" ry="6" fill="#000" opacity=".25"/>
      <rect x="18" y="62" width="10" height="22" fill="#e9cf7a"/>
      <rect x="72" y="62" width="10" height="22" fill="#e9cf7a"/>
      <path d="M17 62 a5 10 0 0 1 10 0 z" fill="#d4af37"/>
      <path d="M71 62 a5 10 0 0 1 10 0 z" fill="#d4af37"/>
      <rect x="30" y="58" width="40" height="26" rx="2" fill="#0e2f24" stroke="#d4af37" stroke-width="1.5"/>
      <path d="M32 58 Q50 22 68 58 Z" fill="#1c7a55" stroke="#d4af37" stroke-width="1.5"/>
      <path d="M38 58 Q50 32 62 58 Z" fill="#12563f"/>
      <rect x="48" y="10" width="4" height="14" fill="#d4af37"/>
      <path d="M50 6 l4 8 h-8 z" fill="#e9cf7a"/>
      <rect x="40" y="70" width="20" height="14" rx="6" fill="#0a2119"/>
    </svg>
    <h1>Baghdad Shareef</h1>
    <div class="sub">Direction to the shrine of Ghaus-e-A&#8217;zam Shaikh Abdul Qadir al-Jeelani (RA)</div>
  </header>

  <div class="status" id="status">Tap <b>Start</b> and allow location + compass access to find the direction.</div>

  <div class="compass-stage">
    <div class="ring"></div>
    <div class="ticks" id="ticks"></div>
    <div class="cardinal">
      <span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span>
    </div>
    <div class="needle-wrap" id="needleWrap">
      <svg class="needle" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Direction needle">
        <polygon points="50,6 60,52 50,44 40,52" fill="#d4af37"/>
        <polygon points="50,94 60,52 50,60 40,52" fill="#e9cf7a" opacity=".55"/>
      </svg>
    </div>
    <div class="hub"></div>
  </div>

  <div class="readout">
    <div class="card">
      <div class="label">Bearing</div>
      <div class="value" id="bearingVal">&#8212;</div>
    </div>
    <div class="card">
      <div class="label">Distance</div>
      <div class="value" id="distVal">&#8212;</div>
    </div>
  </div>

  <div class="btnrow">
    <button id="startBtn">Start &#8212; Find Direction</button>
    <button id="calBtn" class="secondary" style="display:none;">Recalibrate compass (move phone in a figure-8)</button>
  </div>

  <div class="note" id="footnote">
    Works best outdoors on a phone browser with GPS &amp; compass sensors. Keep your phone flat and level.
  </div>
</div>

<script>
  // Coordinates of the Mausoleum of Shaikh Abdul Qadir al-Jeelani (Bab al-Sheikh, Rusafa, Baghdad)
  const SHRINE = { lat: 33.33639, lon: 44.40806 };

  const statusEl = document.getElementById('status');
  const bearingVal = document.getElementById('bearingVal');
  const distVal = document.getElementById('distVal');
  const needleWrap = document.getElementById('needleWrap');
  const startBtn = document.getElementById('startBtn');
  const calBtn = document.getElementById('calBtn');
  const ticks = document.getElementById('ticks');

  // Build tick marks
  for(let i=0;i<72;i++){
    const d = document.createElement('div');
    const deg = i*5;
    d.style.transform = `rotate(${deg}deg)`;
    if(deg % 30 === 0) d.classList.add('major');
    ticks.appendChild(d);
  }

  let bearingToShrine = null;
  let distanceKm = null;
  let compassHeading = 0;
  let orientationActive = false;

  function toRad(d){ return d*Math.PI/180; }
  function toDeg(r){ return r*180/Math.PI; }

  function computeBearingDistance(lat1, lon1, lat2, lon2){
    const phi1 = toRad(lat1), phi2 = toRad(lat2);
    const dLambda = toRad(lon2-lon1);
    const y = Math.sin(dLambda)*Math.cos(phi2);
    const x = Math.cos(phi1)*Math.sin(phi2) - Math.sin(phi1)*Math.cos(phi2)*Math.cos(dLambda);
    let theta = toDeg(Math.atan2(y,x));
    theta = (theta + 360) % 360;

    const R = 6371;
    const dPhi = toRad(lat2-lat1);
    const a = Math.sin(dPhi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dLambda/2)**2;
    const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const dist = R*c;
    return { bearing: theta, distance: dist };
  }

  function updateNeedle(){
    if(bearingToShrine === null) return;
    const rotation = orientationActive ? (bearingToShrine - compassHeading) : bearingToShrine;
    needleWrap.style.transform = `rotate(${rotation}deg)`;
    bearingVal.textContent = Math.round(bearingToShrine) + '&deg;'.replace('&deg;','\u00B0');
  }

  function handleOrientation(event){
    let heading;
    if (typeof event.webkitCompassHeading === 'number') {
      heading = event.webkitCompassHeading; // iOS Safari: already a compass heading
    } else if (event.alpha !== null) {
      heading = 360 - event.alpha; // Android: alpha increases counter-clockwise
    } else {
      return;
    }
    compassHeading = heading;
    orientationActive = true;
    updateNeedle();
  }

  async function enableCompass(){
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') {
          statusEl.textContent = 'Compass permission denied. Showing bearing from true north instead.';
          return;
        }
      } catch(e) {
        statusEl.textContent = 'Could not access the compass sensor on this device.';
        return;
      }
    }
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
    calBtn.style.display = 'block';
  }

  function locate(){
    if (!navigator.geolocation) {
      statusEl.textContent = 'This browser has no location support. Bearing needs your current position.';
      return;
    }
    statusEl.textContent = 'Locating you...';
    navigator.geolocation.watchPosition(pos => {
      const { latitude, longitude } = pos.coords;
      const { bearing, distance } = computeBearingDistance(latitude, longitude, SHRINE.lat, SHRINE.lon);
      bearingToShrine = bearing;
      distanceKm = distance;
      distVal.textContent = distance < 10 ? distance.toFixed(2)+' km' : Math.round(distance).toLocaleString()+' km';
      statusEl.innerHTML = 'Turn until the gold needle points <b>straight up</b> &#8212; that is the direction of Baghdad Shareef.';
      updateNeedle();
    }, err => {
      statusEl.textContent = 'Location error: ' + err.message + '. Please allow location access and try again.';
    }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  }

  startBtn.addEventListener('click', () => {
    enableCompass();
    locate();
    startBtn.textContent = 'Refreshing...';
    setTimeout(()=> startBtn.textContent = 'Refresh', 1200);
  });

  calBtn.addEventListener('click', () => {
    statusEl.textContent = 'Move your phone in a slow figure-8 a few times, away from metal objects.';
  });
</script>
</body>
</html>
