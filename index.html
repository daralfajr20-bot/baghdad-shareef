<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sacred Directions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08201a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sacred Directions">
<link rel="icon" type="image/png" sizes="192x192" href="icon-baghdad-192.png">
<link rel="apple-touch-icon" href="icon-baghdad-192.png">
<style>
  :root{
    --green-deep:#0b3d2e; --green-mid:#12563f; --green-glow:#1c7a55;
    --gold:#d4af37; --gold-soft:#e9cf7a; --cream:#f3ead7; --ink:#0a2119;
    font-family:"Amiri","Georgia",serif;
  }
  :root:not([data-theme="light"]){ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }
  :root[data-theme="dark"]{ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); } }
  :root[data-theme="light"]{ --bg:#08201a; --panel:#0e2f24; --text:var(--cream); }

  *{box-sizing:border-box;}
  /* solid colour on html so overscroll / bounce / notch areas are never white */
  html{ margin:0; min-height:100%; background:#08201a; scroll-padding-top:env(safe-area-inset-top,0px);
    -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  body{
    margin:0; color:var(--text); background:transparent;
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));
    overflow-x:hidden; overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  }
  body.reader-open{ overflow:hidden; }
  /* fixed full-bleed backdrop: fills the whole screen including under the status bar / home indicator */
  .bg{ position:fixed; top:0; left:0; right:0; bottom:0; z-index:0; pointer-events:none;
    background: radial-gradient(circle at 50% -10%, var(--green-mid) 0%, transparent 55%), linear-gradient(180deg, #08201a 0%, #061914 100%); }
  .lattice{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.10;
    background-image: repeating-linear-gradient(45deg, var(--gold) 0 1px, transparent 1px 26px), repeating-linear-gradient(-45deg, var(--gold) 0 1px, transparent 1px 26px); }

  .wrap{ position:relative; z-index:1; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }

  header{ text-align:center; margin-bottom:2px; }
  h1{ font-size:1.2rem; margin:0; color:var(--gold-soft); letter-spacing:.02em; font-weight:700; }
  .sub{ font-size:.76rem; color:rgba(243,234,215,.65); margin-top:3px; font-family:Georgia,serif; font-style:italic; }

  .status{ width:100%; background:rgba(212,175,55,.08); border:1px solid rgba(212,175,55,.35);
    border-radius:14px; padding:12px 15px; margin:14px 0 8px; font-size:.88rem; color:var(--cream); line-height:1.4; text-align:center; min-height:1.4em; }
  .status b{ color:var(--gold-soft); }
  .status.aligned{ background:rgba(212,175,55,.22); border-color:var(--gold); }

  .compass-stage{ position:relative; width:min(80vw,300px); height:min(80vw,300px); margin:16px 0 14px; display:flex; align-items:center; justify-content:center; }
  .ring{ position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, var(--green-glow) 0%, var(--green-mid) 55%, var(--green-deep) 100%);
    box-shadow: 0 0 0 2px rgba(212,175,55,.55), 0 0 0 10px rgba(212,175,55,.08), inset 0 4px 24px rgba(0,0,0,.45); }
  .ticks{ position:absolute; inset:0; }
  .ticks div{ position:absolute; left:50%; top:6px; width:2px; height:11px; background:rgba(233,207,122,.55); transform-origin:1px 144px; }
  .ticks div.major{ height:15px; width:3px; background:var(--gold-soft); }
  .cardinal{ position:absolute; inset:0; font-size:.75rem; font-weight:700; color:var(--gold-soft); }
  .cardinal span{ position:absolute; transform:translate(-50%,-50%); }
  .cardinal span i{ display:inline-block; font-style:normal; }
  .n{ top:8%; left:50%; } .e{ top:50%; left:92%; } .s{ top:92%; left:50%; } .w{ top:50%; left:8%; }

  /* small transparent markers, no boxed backdrop, positioned by relative heading */
  .marker{
    position:absolute; width:30px; height:30px; transform:translate(-50%,-50%);
    z-index:3; transition:filter .2s ease, opacity .3s ease;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  .marker img{ width:100%; height:100%; object-fit:contain; display:block; }
  .marker.pending{ opacity:.35; }
  .marker.active{ filter:drop-shadow(0 0 8px var(--gold-soft)) drop-shadow(0 0 3px #fff); }

  .pointer-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2; }
  .pointer{ width:5px; height:44%; background:linear-gradient(180deg, var(--cream), rgba(243,234,215,.2)); border-radius:4px; position:relative; }
  .pointer::before{ content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:14px solid var(--cream); }

  .hub{ position:absolute; width:11%; height:11%; border-radius:50%; z-index:4;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #8a6b1e 100%); box-shadow:0 0 8px rgba(212,175,55,.7); }

  .legend{ display:flex; gap:10px; width:100%; margin-top:2px; }
  .legend .item{ flex:1; background:var(--panel); border:1px solid rgba(212,175,55,.3); border-radius:14px; padding:9px 6px; text-align:center; transition:border-color .2s ease, background .2s ease; }
  .legend .item.active{ border-color:var(--gold); background:rgba(212,175,55,.15); }
  .legend .item img{ width:28px; height:28px; border-radius:8px; object-fit:cover; margin-bottom:4px; }
  .legend .item .name{ font-size:.66rem; font-weight:700; color:var(--cream); line-height:1.15; }
  .legend .item .dist{ font-size:.62rem; color:var(--gold-soft); margin-top:2px; }

  .btnrow{ display:flex; flex-direction:column; gap:9px; width:100%; margin-top:16px; }
  button{ font-family:inherit; font-size:.92rem; font-weight:700; color:var(--ink);
    background:linear-gradient(180deg, var(--gold-soft), var(--gold)); border:none; border-radius:12px; padding:12px 16px; cursor:pointer;
    box-shadow:0 3px 0 #8a6b1e, 0 6px 14px rgba(0,0,0,.35); }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #8a6b1e; }
  button.secondary{ background:transparent; color:var(--gold-soft); border:1px solid rgba(212,175,55,.5); box-shadow:none; }
  button:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:2px; }

  .note{ font-size:.7rem; color:rgba(243,234,215,.5); text-align:center; margin-top:14px; line-height:1.5; }

  /* top-level section tabs */
  .tabbar{ display:flex; gap:8px; width:100%; margin-bottom:4px; }
  .tabbar button{ flex:1; padding:10px 8px; font-size:.85rem; border-radius:12px;
    background:var(--panel); color:var(--cream); border:1px solid rgba(212,175,55,.3);
    box-shadow:none; }
  .tabbar button.active{ background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:var(--ink); border-color:var(--gold); }

  /* library list */
  .lib-card{ width:100%; background:var(--panel); border:1px solid rgba(212,175,55,.3); border-radius:16px;
    padding:14px; margin-top:12px; display:flex; flex-direction:column; gap:4px; }
  .lib-card h3{ margin:0; color:var(--gold-soft); font-size:1.02rem; }
  .lib-card p{ margin:2px 0 8px; font-size:.78rem; color:rgba(243,234,215,.75); line-height:1.4; }
  .lib-actions{ display:flex; gap:8px; }
  .read-btn, .dl-btn{ flex:1; text-align:center; font-family:inherit; font-size:.82rem; font-weight:700;
    border-radius:10px; padding:9px 10px; text-decoration:none; cursor:pointer; display:inline-block; }
  .read-btn{ background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:var(--ink) !important; border:none; box-shadow:0 2px 0 #8a6b1e; }
  .dl-btn, .dl-btn:link, .dl-btn:visited, .dl-btn:hover, .dl-btn:active{ background:transparent; color:var(--gold-soft) !important; border:1px solid rgba(212,175,55,.5); }

  /* pdf reader - true full screen, same green/gold look as the rest of the app */
  .reader-fullscreen{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:50;
    background: radial-gradient(circle at 50% -10%, var(--green-mid) 0%, transparent 55%), linear-gradient(180deg, #08201a 0%, #061914 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));
    overflow:hidden;
  }
  .reader{ width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center; flex:1; min-height:0; position:relative; z-index:1; }
  .reader-top{ display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:8px; gap:8px; flex:none; }
  .reader-top .back-btn{ background:transparent; border:1px solid rgba(212,175,55,.5); color:var(--gold-soft); border-radius:10px; padding:8px 12px; font-size:.82rem; box-shadow:none; flex:none; }
  .reader-top h3{ margin:0; color:var(--gold-soft); font-size:.92rem; text-align:center; flex:1; }
  .reader-top .dl-btn{ flex:none; padding:8px 12px; font-size:.8rem; }
  /* the stage is the app background itself (no white); the page is centred inside it */
  .reader-stage{ flex:1; min-height:0; width:100%; display:flex; padding:6px; overflow:auto; -webkit-overflow-scrolling:touch;
    background:transparent; border-radius:14px; border:1px solid rgba(212,175,55,.25); background:rgba(14,47,36,.55); }
  .reader-stage canvas{ display:block; margin:auto; flex:none; border-radius:4px;
    box-shadow:0 0 0 2px var(--gold), 0 0 0 7px rgba(212,175,55,.10), 0 10px 26px rgba(0,0,0,.5); }
  .reader-nav{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:10px; flex:none; }
  .reader-nav button{ padding:10px 14px; font-size:.88rem; }
  .reader-nav button.secondary{ padding:10px 12px; }
  .reader-nav button:disabled{ opacity:.4; cursor:default; }
  .reader-page-ind{ color:var(--cream); font-size:.85rem; min-width:84px; text-align:center; }
  .reader-loading{ color:var(--cream); font-size:.85rem; margin:auto; padding:30px 0; text-align:center; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="lattice"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const DESTINATIONS_BASE = [
  { id:'baghdad', label:'Baghdad Shareef', icon:'marker-baghdad.png', legendIcon:'icon-baghdad-192.png', lat:33.33639, lon:44.40806 },
  { id:'kaaba',   label:'Al-Kaabah, Makkah', icon:'marker-kaaba.png', legendIcon:'icon-kaaba-192.png', lat:21.4225,  lon:39.8262 },
  { id:'madina',  label:'Madina Shareef', icon:'marker-madina.png', legendIcon:'icon-madina-192.png', lat:24.4672,  lon:39.6112 }
];
const ALIGN_THRESHOLD = 9;   // degrees - unchanged
const CLOSE_GAP = 24;        // degrees - destinations closer than this get placed on different rings
const RING_RADII = [41, 29, 17]; // % of compass radius: outer, middle, inner

function toRad(d){ return d*Math.PI/180; }
function toDeg(r){ return r*180/Math.PI; }
function angDiff(a,b){ let d = Math.abs(a-b) % 360; return d > 180 ? 360-d : d; }

function computeBearingDistance(lat1, lon1, lat2, lon2){
  const phi1 = toRad(lat1), phi2 = toRad(lat2);
  const dLambda = toRad(lon2-lon1);
  const y = Math.sin(dLambda)*Math.cos(phi2);
  const x = Math.cos(phi1)*Math.sin(phi2) - Math.sin(phi1)*Math.cos(phi2)*Math.cos(dLambda);
  let theta = toDeg(Math.atan2(y,x));
  theta = (theta + 360) % 360;
  const R = 6371;
  const dPhi = toRad(lat2-lat1);
  const a = Math.sin(dPhi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dLambda/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return { bearing: theta, distance: R*c };
}

// Icons ALWAYS sit at their exact bearing angle. If two destinations are close in bearing
// (Makkah and Madina are only ~340 km apart), the second one is placed on an inner ring
// instead, so they never overlap and no direction is ever visually shifted.
function assignRings(items){
  const levels = {};
  const placed = [];
  [...items].sort((a,b)=>a.bearing-b.bearing).forEach(it => {
    let level = 0;
    while(placed.some(p => p.level === level && angDiff(p.bearing, it.bearing) < CLOSE_GAP)) level++;
    level = Math.min(level, RING_RADII.length-1);
    placed.push({ bearing: it.bearing, level });
    levels[it.id] = level;
  });
  return levels;
}

function Compass(){
  const [destinations, setDestinations] = useState(DESTINATIONS_BASE.map(d => ({...d, bearing:null, distance:null})));
  const [compassHeading, setCompassHeading] = useState(0);   // unwrapped + smoothed, used for the dial
  const [orientationActive, setOrientationActive] = useState(false);
  const [bearingsReady, setBearingsReady] = useState(false);
  const [statusMsg, setStatusMsg] = useState('Tap Start and allow location + compass access, then turn slowly.');
  const [aligned, setAligned] = useState(false);
  const [matchedId, setMatchedId] = useState(null);
  const [calibrateVisible, setCalibrateVisible] = useState(false);
  const [debugHeading, setDebugHeading] = useState(null);
  const [startLabel, setStartLabel] = useState('Start — Find Directions');
  const warnedRelative = useRef(false);
  const headingRef = useRef(null);
  const rafRef = useRef(0);
  const watchRef = useRef(null);
  const listening = useRef(false);

  const ticksRef = useRef(null);

  // always-normalised 0..360 heading for all comparisons / marker maths
  const hNorm = ((compassHeading % 360) + 360) % 360;

  const handleOrientation = useCallback((event) => {
    let raw = null;
    if (typeof event.webkitCompassHeading === 'number' && !isNaN(event.webkitCompassHeading) && event.webkitCompassHeading >= 0) {
      raw = event.webkitCompassHeading;               // iOS: true compass heading
    } else if ((event.absolute === true || event.type === 'deviceorientationabsolute') && event.alpha != null) {
      raw = (360 - event.alpha) % 360;                // Android absolute orientation
    }
    if (raw === null) {
      // iOS reports -1 while uncalibrated; Android 'deviceorientation' without absolute is relative. Keep waiting.
      if (!warnedRelative.current) {
        warnedRelative.current = true;
        setStatusMsg('Waiting for compass signal… move your phone in a slow figure-8 and keep it flat.');
      }
      return;
    }
    // low-pass filter in unwrapped space: smooth, and never spins the long way round at 359° -> 0°
    if (headingRef.current === null) {
      headingRef.current = raw;
    } else {
      const cur = headingRef.current;
      const delta = (((raw - (cur % 360)) + 540) % 360) - 180;
      headingRef.current = cur + delta * 0.3;
    }
    if (!rafRef.current) {
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = 0;
        setCompassHeading(headingRef.current);
        setDebugHeading(((headingRef.current % 360) + 360) % 360);
        setOrientationActive(true);
      });
    }
  }, []);

  const attachCompass = useCallback(() => {
    window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
    window.removeEventListener('deviceorientation', handleOrientation, true);
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
    listening.current = true;
  }, [handleOrientation]);

  const enableCompass = useCallback(async () => {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') {
          setStatusMsg('Compass permission denied. Cannot detect facing direction.');
          return;
        }
      } catch (e) {
        setStatusMsg('Could not access the compass sensor on this device.');
        return;
      }
    }
    attachCompass();
    setCalibrateVisible(true);
  }, [attachCompass]);

  // iOS stops delivering sensor events when the PWA is backgrounded - re-attach on return
  useEffect(() => {
    const onVis = () => { if (document.visibilityState === 'visible' && listening.current) attachCompass(); };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [attachCompass]);

  const locate = useCallback(() => {
    if (!navigator.geolocation) { setStatusMsg('This browser has no location support.'); return; }
    setStatusMsg('Locating you...');
    if (watchRef.current !== null) { navigator.geolocation.clearWatch(watchRef.current); watchRef.current = null; }

    const onPos = (pos) => {
      const { latitude, longitude } = pos.coords;
      setDestinations(prev => prev.map(dest => {
        const { bearing, distance } = computeBearingDistance(latitude, longitude, dest.lat, dest.lon);
        return { ...dest, bearing, distance };
      }));
      setBearingsReady(true);
    };

    const startWatch = (high) => {
      watchRef.current = navigator.geolocation.watchPosition(onPos, (err) => {
        if (err.code === 1) {
          setStatusMsg('Location permission denied. Please allow location access (Settings › Privacy › Location Services) and tap Refresh.');
          return;
        }
        // Timeout / unavailable is common on iPhones using Approximate Location:
        // drop to a low-accuracy watch instead of giving up (this is what left the pointers frozen).
        if (high) {
          if (watchRef.current !== null) navigator.geolocation.clearWatch(watchRef.current);
          startWatch(false);
        } else {
          setStatusMsg('Could not get your location (' + err.message + '). Check Location Services, then tap Refresh.');
        }
      }, { enableHighAccuracy: high, maximumAge: high ? 5000 : 120000, timeout: high ? 10000 : 30000 });
    };

    // 1) a quick coarse fix so the icons appear immediately (works with Approximate Location)
    navigator.geolocation.getCurrentPosition(onPos, () => {}, { enableHighAccuracy: false, maximumAge: 600000, timeout: 10000 });
    // 2) then refine with a live watch
    startWatch(true);
  }, []);

  const handleStart = () => {
    enableCompass();
    locate();
    setStartLabel('Refreshing...');
    setTimeout(() => setStartLabel('Refresh'), 1200);
  };

  const handleCalibrate = () => {
    setStatusMsg('Move your phone in a slow figure-8 a few times, away from metal objects.');
  };

  // recompute alignment + status whenever heading or bearings change
  useEffect(() => {
    if (!bearingsReady) return;

    let matched = null;
    let nearest = null; let nearestDiff = 999;
    destinations.forEach(dest => {
      const diff = angDiff(hNorm, dest.bearing);
      if (diff <= ALIGN_THRESHOLD) matched = dest;
      if (diff < nearestDiff) { nearestDiff = diff; nearest = dest; }
    });

    setMatchedId(matched ? matched.id : null);
    setAligned(!!matched);

    if (matched) {
      setStatusMsg(`Now you're pointing at ${matched.label}`);
    } else if (orientationActive && nearest) {
      let rel = ((nearest.bearing - hNorm + 540) % 360) - 180;
      const dir = rel < 0 ? 'left' : 'right';
      setStatusMsg(`Turn ${dir} about ${Math.round(Math.abs(rel))}° to face ${nearest.label}`);
    } else if (!orientationActive) {
      setStatusMsg('Compass not active — showing directions as if facing North. Grant motion access for live pointing.');
    }
  }, [hNorm, bearingsReady, destinations, orientationActive]);

  // build tick marks once
  useEffect(() => {
    if (!ticksRef.current) return;
    ticksRef.current.innerHTML = '';
    for (let i = 0; i < 72; i++) {
      const d = document.createElement('div');
      const deg = i * 5;
      d.style.transform = `rotate(${deg}deg)`;
      if (deg % 30 === 0) d.className = 'major';
      ticksRef.current.appendChild(d);
    }
  }, []);

  const dialTransform = `rotate(${-compassHeading}deg)`;
  const letterTransform = `rotate(${compassHeading}deg)`;

  // ring level depends only on true bearings, so it is stable while the phone turns
  const ringById = bearingsReady ? assignRings(destinations) : {};

  return (
    <>
      <div className={"status" + (aligned ? " aligned" : "")} dangerouslySetInnerHTML={{__html: statusMsg.replace(
        new RegExp('(' + destinations.map(d=>d.label).join('|') + ')'), '<b>$1</b>'
      )}} />

      <div className="compass-stage">
        <div className="ring"></div>
        <div style={{position:'absolute', inset:0, transform:dialTransform}}>
          <div className="ticks" ref={ticksRef}></div>
          <div className="cardinal">
            <span className="n"><i style={{display:'inline-block', transform:letterTransform}}>N</i></span>
            <span className="e"><i style={{display:'inline-block', transform:letterTransform}}>E</i></span>
            <span className="s"><i style={{display:'inline-block', transform:letterTransform}}>S</i></span>
            <span className="w"><i style={{display:'inline-block', transform:letterTransform}}>W</i></span>
          </div>
        </div>

        {destinations.map(dest => {
          const angle = bearingsReady ? (dest.bearing - hNorm + 360) % 360 : 0;
          const radiusPct = RING_RADII[ringById[dest.id] || 0];
          const x = 50 + radiusPct * Math.sin(toRad(angle));
          const y = 50 - radiusPct * Math.cos(toRad(angle));
          return (
            <div
              key={dest.id}
              className={"marker" + (matchedId === dest.id ? " active" : "") + (bearingsReady ? "" : " pending")}
              style={{ left: x + '%', top: y + '%' }}
            >
              <img src={dest.icon} alt={dest.label} />
            </div>
          );
        })}

        <div className="pointer-wrap"><div className="pointer"></div></div>
        <div className="hub"></div>
      </div>

      <div className="legend">
        {destinations.map(dest => (
          <div key={dest.id} className={"item" + (matchedId === dest.id ? " active" : "")}>
            <img src={dest.legendIcon} alt={dest.label} />
            <div className="name">{dest.label}</div>
            <div className="dist">
              {dest.distance == null ? '—' :
                (dest.distance < 10 ? dest.distance.toFixed(2) : Math.round(dest.distance).toLocaleString()) + ' km · ' + Math.round(dest.bearing) + '°'}
            </div>
          </div>
        ))}
      </div>

      <div className="btnrow">
        <button onClick={handleStart}>{startLabel}</button>
        {calibrateVisible && (
          <button className="secondary" onClick={handleCalibrate}>Recalibrate compass (move phone in a figure-8)</button>
        )}
      </div>

      <div className="note">Hold your phone flat, turn slowly in a full circle. When the white arrow lines up with an icon, you're facing that sacred direction. Works best outdoors with GPS.</div>
      <div className="note" style={{opacity:.8}}>
        Device heading: {debugHeading == null ? '—' : Math.round(debugHeading) + '° (compare with your phone\'s built-in compass to verify)'}
      </div>
    </>
  );
}

const LIBRARY_DOCS = [
  { id:'khatam', title:'Khatam E Qadriya', file:'khatam-e-qadria.pdf',
    description:'A collection of durood, surahs and dua read together for cure from ailments, relief from hardship, and the removal of calamity, through the tawassul of Ghaus-e-Azam Shaikh Abdul Qadir al-Jeelani (RA).' },
  { id:'qaseeda', title:'Qaseeda E Ghousia', file:'qaseeda-e-ghousia.pdf',
    description:'The widely-recited qaseeda (ode) of Shaikh Abdul Qadir al-Jeelani (RA), read by his devotees seeking blessings and intercession.' }
];

function PdfReader({ doc, onBack }){
  const [pdf, setPdf] = useState(null);
  const [pageNum, setPageNum] = useState(1);
  const [numPages, setNumPages] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [fitMode, setFitMode] = useState('page');       // 'page' = whole page centred, 'width' = fill width and scroll
  const [box, setBox] = useState({ w: 0, h: 0 });
  const canvasRef = useRef(null);
  const stageRef = useRef(null);
  const taskRef = useRef(null);

  // lock the app behind the reader so nothing scrolls / shows through
  useEffect(() => {
    document.body.classList.add('reader-open');
    return () => document.body.classList.remove('reader-open');
  }, []);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setError(null);
    pdfjsLib.getDocument(doc.file).promise.then(loadedPdf => {
      if (cancelled) return;
      setPdf(loadedPdf);
      setNumPages(loadedPdf.numPages);
      setPageNum(1);
      setLoading(false);
    }).catch(err => {
      if (cancelled) return;
      setError('Could not load this document. ' + err.message);
      setLoading(false);
    });
    return () => { cancelled = true; };
  }, [doc]);

  // measure the available stage (re-measures on rotation / resize / iOS toolbar changes)
  useEffect(() => {
    const el = stageRef.current;
    if (!el) return;
    const measure = () => setBox({ w: el.clientWidth, h: el.clientHeight });
    measure();
    let ro = null;
    if (window.ResizeObserver) { ro = new ResizeObserver(measure); ro.observe(el); }
    window.addEventListener('resize', measure);
    window.addEventListener('orientationchange', measure);
    return () => {
      if (ro) ro.disconnect();
      window.removeEventListener('resize', measure);
      window.removeEventListener('orientationchange', measure);
    };
  }, []);

  useEffect(() => {
    if (!pdf || !canvasRef.current || !box.w || !box.h) return;
    let cancelled = false;
    pdf.getPage(pageNum).then(page => {
      if (cancelled) return;
      const canvas = canvasRef.current;
      if (!canvas) return;
      const context = canvas.getContext('2d');
      const base = page.getViewport({ scale: 1 });

      // stage has 6px padding each side + room for the gold frame
      const availW = Math.max(100, box.w - 12 - 14);
      const availH = Math.max(100, box.h - 12 - 14);
      const cssScale = fitMode === 'page'
        ? Math.min(availW / base.width, availH / base.height)
        : availW / base.width;
      const cssViewport = page.getViewport({ scale: cssScale });

      // render at the device's real pixel density so text stays sharp on Retina screens
      const outputScale = Math.min(window.devicePixelRatio || 1, 3);
      const renderViewport = page.getViewport({ scale: cssScale * outputScale });

      canvas.width = Math.floor(renderViewport.width);
      canvas.height = Math.floor(renderViewport.height);
      canvas.style.width = Math.floor(cssViewport.width) + 'px';
      canvas.style.height = Math.floor(cssViewport.height) + 'px';

      if (taskRef.current) { try { taskRef.current.cancel(); } catch (e) {} }
      const task = page.render({ canvasContext: context, viewport: renderViewport });
      taskRef.current = task;
      task.promise.catch(() => {});
    });
    return () => {
      cancelled = true;
      if (taskRef.current) { try { taskRef.current.cancel(); } catch (e) {} }
    };
  }, [pdf, pageNum, box.w, box.h, fitMode]);

  // bring the new page back to the top when turning pages in "fit width" mode
  useEffect(() => { if (stageRef.current) stageRef.current.scrollTop = 0; }, [pageNum, fitMode]);

  return (
    <div className="reader-fullscreen">
      <div className="reader">
        <div className="reader-top">
          <button className="back-btn" onClick={onBack}>&larr; Back</button>
          <h3>{doc.title}</h3>
          <a className="dl-btn" href={doc.file} download>Download</a>
        </div>
        <div className="reader-stage" ref={stageRef}>
          {loading && <div className="reader-loading">Loading…</div>}
          {error && <div className="reader-loading">{error}</div>}
          {!loading && !error && <canvas ref={canvasRef}></canvas>}
        </div>
        <div className="reader-nav">
          <button onClick={() => setPageNum(p => Math.max(1, p - 1))} disabled={pageNum <= 1}>&lsaquo; Prev</button>
          <span className="reader-page-ind">{numPages ? `Page ${pageNum} / ${numPages}` : '—'}</span>
          <button onClick={() => setPageNum(p => Math.min(numPages || p, p + 1))} disabled={!numPages || pageNum >= numPages}>Next &rsaquo;</button>
          <button className="secondary" onClick={() => setFitMode(m => m === 'page' ? 'width' : 'page')}>{fitMode === 'page' ? 'Zoom' : 'Fit'}</button>
        </div>
      </div>
    </div>
  );
}

function Library(){
  const [selected, setSelected] = useState(null);
  if (selected) return <PdfReader doc={selected} onBack={() => setSelected(null)} />;
  return (
    <>
      {LIBRARY_DOCS.map(doc => (
        <div className="lib-card" key={doc.id}>
          <h3>{doc.title}</h3>
          <p>{doc.description}</p>
          <div className="lib-actions">
            <button className="read-btn" onClick={() => setSelected(doc)}>Read</button>
            <a className="dl-btn" href={doc.file} download>Download</a>
          </div>
        </div>
      ))}
    </>
  );
}

function App(){
  const [tab, setTab] = useState('compass');
  return (
    <div className="wrap">
      <header>
        <h1>Sacred Directions</h1>
        <div className="sub">Baghdad Shareef · Kaabah · Madina Shareef</div>
      </header>

      <div className="tabbar">
        <button className={tab === 'compass' ? 'active' : ''} onClick={() => setTab('compass')}>Compass</button>
        <button className={tab === 'library' ? 'active' : ''} onClick={() => setTab('library')}>Wazaif &amp; Prayers</button>
      </div>

      {tab === 'compass' ? <Compass /> : <Library />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
